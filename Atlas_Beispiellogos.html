<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  body { margin: 0; background: #f8f9fa; font-family: Arial, sans-serif; padding: 40px; }
  .container { display: flex; gap: 60px; align-items: center; justify-content: center; }
  .logo { display: flex; align-items: center; gap: 12px; }
  .icon { width: 52px; height: 52px; border-radius: 10px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .text-block { display: flex; flex-direction: column; }
  .name { font-weight: 700; font-size: 14px; line-height: 1.3; }
  .tagline { font-size: 8px; letter-spacing: 1.5px; color: #999; margin-top: 3px; text-transform: uppercase; }
</style>
</head>
<body>
<div class="container">

  <!-- Stadtwerke Nordlicht -->
  <div class="logo">
    <div class="icon" style="background:#003366; position:relative; overflow:hidden;">
      <svg width="52" height="52" viewBox="0 0 52 52">
        <text x="26" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="white" font-family="Arial">N</text>
        <polygon points="32,8 24,26 30,26 22,44 38,22 30,22" fill="#00AAFF" opacity="0.9"/>
      </svg>
    </div>
    <div class="text-block">
      <span class="name" style="color:#003366;">Stadtwerke<br>Nordlicht</span>
      <span class="tagline">Energie · Wärme · Wasser</span>
    </div>
  </div>

  <!-- EnerTec -->
  <div class="logo">
    <div class="icon" style="background:#1a8a3c;">
      <svg width="52" height="52" viewBox="0 0 52 52">
        <text x="26" y="36" text-anchor="middle" font-size="28" font-weight="900" fill="white" font-family="Arial">E</text>
        <rect x="8" y="44" width="36" height="3" rx="1.5" fill="#7fdc9f"/>
      </svg>
    </div>
    <div class="text-block">
      <span class="name"><span style="color:#1a8a3c;">Ener</span><span style="color:#333;">Tec</span></span>
      <span class="tagline">Regional · Digital · Grün</span>
    </div>
  </div>

  <!-- Rheingas & Wärme -->
  <div class="logo">
    <div class="icon" style="background:#c0392b;">
      <svg width="52" height="52" viewBox="0 0 52 52">
        <path d="M26 6 C16 18 13 28 18 37 C20 32 22 30 26 32 C30 30 32 32 34 37 C39 28 36 18 26 6Z" fill="white" opacity="0.95"/>
        <ellipse cx="26" cy="35" rx="7" ry="9" fill="#f39c12" opacity="0.8"/>
      </svg>
    </div>
    <div class="text-block">
      <span class="name" style="color:#c0392b;">Rheingas<br><span style="color:#555;">&amp; Wärme</span></span>
      <span class="tagline">Seit 1952 · Verlässlich</span>
    </div>
  </div>

</div>

<p style="text-align:center; color:#bbb; font-size:10px; margin-top:40px;">
  Fiktive Beispiellogos — werden durch echte Kundenlogos ersetzt
</p>
</body>
</html>
